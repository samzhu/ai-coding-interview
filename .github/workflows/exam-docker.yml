name: Build Exam Docker Image

on:
  workflow_dispatch:
    inputs:
      exam_id:
        description: "Exam ID (e.g. 100, 101)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./exams/${{ inputs.exam_id }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            spike19820318/ai-coding-interview-exam-${{ inputs.exam_id }}:latest
          cache-from: type=gha,scope=exam-${{ inputs.exam_id }}
          cache-to: type=gha,mode=max,scope=exam-${{ inputs.exam_id }}
