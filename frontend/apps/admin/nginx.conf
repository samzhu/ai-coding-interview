events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic routes for /interviews/[id]/monitor
    location ~ ^/interviews/[^/.]+/monitor(/)?$ {
      try_files $uri $uri/ /interviews/_/monitor/index.html =404;
    }

    # Dynamic routes for /interviews/[id] (but not /interviews/new)
    location ~ ^/interviews/(?!new(/|$))[^/.]+(/)?$ {
      try_files $uri $uri/ /interviews/_/index.html =404;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/index.html /index.html;
    }
  }
}
