events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic routes for /interview/[id]/complete
    location ~ ^/interview/[^/.]+/complete(/)?$ {
      try_files $uri $uri/ /interview/_/complete/index.html =404;
    }

    # Dynamic routes for /interview/[id]
    location ~ ^/interview/[^/.]+(/)?$ {
      try_files $uri $uri/ /interview/_/index.html =404;
    }

    # Dynamic routes for /invite/[token]
    location ~ ^/invite/[^/.]+(/)?$ {
      try_files $uri $uri/ /invite/_/index.html =404;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/index.html /index.html;
    }
  }
}
