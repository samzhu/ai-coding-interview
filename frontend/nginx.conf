worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ─── Static assets: long cache ───
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── Dynamic routes: specific before general ───

        # /interview/<id>/complete → /interview/_/complete/index.html
        location ~ ^/interview/[^/.]+/complete(/)?$ {
            try_files /interview/_/complete/index.html =404;
        }

        # /interview/<id> → /interview/_/index.html
        location ~ ^/interview/[^/.]+(/)?$ {
            try_files /interview/_/index.html =404;
        }

        # /invite/<token> → /invite/_/index.html
        location ~ ^/invite/[^/.]+(/)?$ {
            try_files /invite/_/index.html =404;
        }

        # /admin/interviews/<id>/monitor → /admin/interviews/_/monitor/index.html
        location ~ ^/admin/interviews/[^/.]+/monitor(/)?$ {
            try_files /admin/interviews/_/monitor/index.html =404;
        }

        # /admin/interviews/<id> (exclude "new") → /admin/interviews/_/index.html
        location ~ ^/admin/interviews/(?!new(/|$))[^/.]+(/)?$ {
            try_files /admin/interviews/_/index.html =404;
        }

        # ─── SPA fallback ───
        location / {
            try_files $uri $uri/index.html /index.html;
        }
    }
}
