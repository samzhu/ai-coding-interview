id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeeee1"
title: "Spring Boot TODO 服務除錯"
description: |
  A junior engineer wrote a TODO management service. The code compiles but all tests fail.
  The service has 4 independent bugs in different methods.

  Your task is to find and fix each bug one by one across 4 checkpoints.
  You do NOT need to write new features — only debug existing code.

  The service uses a dual data structure: an ArrayList for ordered storage
  and a HashMap for fast lookup by ID. Both must stay in sync.
difficulty: MEDIUM
language: java
type: DEBUG
level: JUNIOR

projectFiles:
  - filePath: TodoItem.java
    editable: false
    sortOrder: 1
  - filePath: TodoRepository.java
    editable: false
    sortOrder: 2
  - filePath: TodoService.java
    editable: true
    sortOrder: 3
  - filePath: TestCP1.java
    editable: false
    sortOrder: 4
  - filePath: TestCP2.java
    editable: false
    sortOrder: 5
  - filePath: TestCP3.java
    editable: false
    sortOrder: 6
  - filePath: TestCP4.java
    editable: false
    sortOrder: 7

checkpoints:
  - id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeee11"
    sequenceNumber: 1
    title: "Bug 1 — addTodo() ID 不遞增"
    description: |
      ## Checkpoint 1: Bug 1

      `TodoService.addTodo()` always returns a TODO with id="1".
      Every new TODO gets the same ID instead of incrementing.

      ### Run Tests

      ```
      cd /tmp/workspace && javac *.java && java TestCP1
      ```

      ### Hint

      Look at where `nextId` is declared. Is it a field or a local variable?

      ### Scoring Focus

      This tests basic Java scoping knowledge. The fix should be minimal.
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP1"
    aiEnabled: false

  - id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeee12"
    sequenceNumber: 2
    title: "Bug 2 — markDone() 用 == 比較 String"
    description: |
      ## Checkpoint 2: Bug 2

      `TodoService.markDone(String id)` never finds a matching TODO.
      The method iterates through all items but never marks any as done.

      ### Run Tests

      ```
      cd /tmp/workspace && javac *.java && java TestCP2
      ```

      ### Hint

      How does Java compare String values? What is the difference between `==` and `.equals()`?

      ### Scoring Focus

      Classic Java pitfall. The fix should also handle the case where `id` might be null.
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP2"
    aiEnabled: false

  - id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeee13"
    sequenceNumber: 3
    title: "Bug 3 — getByStatus() 的 ConcurrentModificationException"
    description: |
      ## Checkpoint 3: Bug 3

      `TodoService.getByStatus(String status)` throws a `ConcurrentModificationException`
      when filtering items.

      ### Run Tests

      ```
      cd /tmp/workspace && javac *.java && java TestCP3
      ```

      ### Hint

      The method iterates a list with a for-each loop while calling `remove()` inside the loop.
      This modifies the list during iteration, which is not allowed.

      ### Scoring Focus

      Choose a fix that matches the existing code style (look at how other filtering is done in Java).
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP3"
    aiEnabled: true

  - id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeee14"
    sequenceNumber: 4
    title: "Bug 4 — deleteTodo() 只刪 list 不刪 map"
    description: |
      ## Checkpoint 4: Bug 4

      `TodoService.deleteTodo(String id)` removes the item from the list,
      but `findById(id)` still returns the deleted item.

      ### Run Tests

      ```
      cd /tmp/workspace && javac *.java && java TestCP4
      ```

      ### Hint

      The service uses two data structures: `todoList` (ArrayList) and `todoMap` (HashMap).
      Both must be kept in sync for all operations.

      ### Scoring Focus

      Identify the dual data structure pattern and ensure consistency.
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP4"
    aiEnabled: true
