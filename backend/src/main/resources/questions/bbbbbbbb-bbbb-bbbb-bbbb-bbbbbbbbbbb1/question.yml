id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbb1"
title: "Java 學生成績管理器"
description: |
  You inherit a student grade management system that filters and computes class statistics.

  Grade scale: A(90-100), B(80-89), C(70-79), D(60-69), F(0-59)

  Common AI-generated pitfalls:
  - Comparing Strings with == instead of .equals() (passes with literals, fails with dynamic strings)
  - Integer division when computing averages (losing decimal precision)

  Your tasks across 3 checkpoints:
  1. Fix a string-comparison bug in the grade filter
  2. Implement statistics: average score, top students, grade distribution
  3. Handle edge cases: empty class, boundary scores, tie scores
difficulty: EASY
language: java
type: EXTEND
level: JUNIOR

projectFiles:
  - filePath: GradeManager.java
    editable: true
    sortOrder: 1
  - filePath: Student.java
    editable: false
    sortOrder: 2
  - filePath: TestCP1.java
    editable: false
    sortOrder: 3
  - filePath: TestCP2.java
    editable: false
    sortOrder: 4
  - filePath: TestCP3.java
    editable: false
    sortOrder: 5

checkpoints:
  - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb11"
    sequenceNumber: 1
    title: "Phase 1: Bug Fix — 修復字串比較"
    description: |
      ## Checkpoint 1: Bug Fix

      `GradeManager.java` 的 `filterByGrade()` 方法使用 `==` 比較字串，
      這是 Java 初學者（以及 AI）常犯的經典錯誤：

      `==` 比較的是**物件參考（reference）**，不是字串內容。
      對字串字面值（literal）有時因 String Pool 會僥倖成功，
      但對動態建立的字串（如 `new String("A")` 或方法回傳值）則永遠失敗。

      ### 執行測試

      ```
      cd /tmp/workspace && javac *.java && java TestCP1
      ```

      ### 任務

      修復 `filterByGrade()` 改用 `.equals()` 進行字串比較。

      ⚠️ **用 `==` 比較 String 是最常見的 AI 陷阱**
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP1"
    aiEnabled: true

  - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb12"
    sequenceNumber: 2
    title: "Phase 2: 實作成績統計"
    description: |
      ## Checkpoint 2: Core Implementation（可使用 AI）

      在 `GradeManager.java` 中實作 3 個統計方法：

      ### `getAverageScore() -> double`
      計算所有學生的平均分數。
      - 若沒有學生，回傳 `0.0`
      - ⚠️ 使用 `(double) sum / count`，避免整數除法截斷小數

      ### `getTopStudents(int n) -> List<Student>`
      回傳分數最高的 N 位學生（依分數降序排列）。
      - 若 `n` 大於學生總數，回傳所有學生
      - 分數相同者順序不限

      ### `getGradeDistribution() -> Map<String, Integer>`
      回傳各等第的學生人數，格式：`{"A": 2, "B": 3, ...}`
      - 只包含人數 > 0 的等第

      ### 執行測試

      ```
      cd /tmp/workspace && javac *.java && java TestCP2
      ```

      ### 重要提示

      ⚠️ **整數除法陷阱**：`370 / 5` 在 Java 中是整數除法，結果為 `74`（正確），
      但 `371 / 5` 結果為 `74`（截斷！）。應使用 `(double) sum / count`。
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP2"
    aiEnabled: true

  - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbb13"
    sequenceNumber: 3
    title: "Phase 3: Edge Cases 驗證"
    description: |
      ## Checkpoint 3: Edge Cases（可使用 AI）

      確保你的成績管理器正確處理所有邊界條件：

      1. **空班級**：無學生時，`getAverageScore()` 回傳 `0.0`，`getTopStudents()` 回傳空 list
      2. **單一學生**：平均即為該學生分數，top-1 正確回傳
      3. **恰好在邊界**：分數 90 → A，80 → B，70 → C，60 → D，59 → F
      4. **同分（tie）**：`getTopStudents(2)` 在兩個同分學生時應都包含
      5. **n 超出範圍**：`getTopStudents(100)` 在只有 3 位學生時應回傳 3 位
      6. **過濾不存在的等第**：`filterByGrade("A")` 在全部都是 F 時應回傳空 list

      ### 執行測試

      ```
      cd /tmp/workspace && javac *.java && java TestCP3
      ```

      ### 評分重點

      - 解釋 `==` vs `.equals()` 的根本差異（String Pool / 物件參考）
      - 說明為何整數除法在此處是個陷阱，以及何時會出現截斷
    testCommand: "cd /tmp/workspace && javac *.java && java TestCP3"
    aiEnabled: true
