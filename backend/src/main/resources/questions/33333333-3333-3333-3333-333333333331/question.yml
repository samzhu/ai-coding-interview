id: "33333333-3333-3333-3333-333333333331"
title: "Python TODO 管理器"
description: |
  You receive a mini Python project with a TodoStore class skeleton. Extend it to support adding, retrieving, completing, and filtering TODO items. This simulates a real-world codebase extension task.
difficulty: MEDIUM
language: python
type: BUILD
level: JUNIOR

projectFiles:
  - filePath: solution.py
    editable: true
    sortOrder: 1
  - filePath: tests/test_cp1.py
    editable: false
    sortOrder: 2
  - filePath: tests/test_cp2.py
    editable: false
    sortOrder: 3
  - filePath: tests/test_cp3.py
    editable: false
    sortOrder: 4

checkpoints:
  - id: "33333333-3333-3333-3333-333333333311"
    sequenceNumber: 1
    title: "Implement add() and get_all()"
    description: |
      ## Checkpoint 1: Basic CRUD

      Implement the two foundational methods in `TodoStore`:

      ### `add(title: str) -> dict`
      Creates a new todo item and returns it as a dict:
      ```python
      {"id": 1, "title": "Buy groceries", "done": False}
      ```
      - `id` should be a unique integer (auto-increment starting from 1)
      - `done` should always be `False` for new items

      ### `get_all() -> list`
      Returns all todo items as a list. Returns `[]` if empty.

      Run `python tests/test_cp1.py` to verify your implementation.
    testCommand: "python tests/test_cp1.py"
    aiEnabled: true

  - id: "33333333-3333-3333-3333-333333333312"
    sequenceNumber: 2
    title: "Implement mark_done() and get_pending()"
    description: |
      ## Checkpoint 2: Status Management

      Implement two more methods in `TodoStore`:

      ### `mark_done(item_id: int) -> dict`
      Marks the item with the given id as done:
      - Find the item by `id`
      - If not found, raise `ValueError(f"Item {item_id} not found")`
      - Set `done = True`
      - Return the updated item

      ### `get_pending() -> list`
      Returns only items where `done` is `False`.

      Run `python tests/test_cp2.py` to verify.
    testCommand: "python tests/test_cp2.py"
    aiEnabled: true

  - id: "33333333-3333-3333-3333-333333333313"
    sequenceNumber: 3
    title: "Edge Cases and Data Integrity"
    description: |
      ## Checkpoint 3: Edge Cases

      Ensure your implementation handles edge cases correctly:

      1. **Sequential IDs** — IDs should increment (1, 2, 3, ...)
      2. **Insertion order** — `get_all()` returns items in the order they were added
      3. **Isolation** — marking one item done should not affect other items
      4. **Idempotent mark_done** — calling `mark_done()` twice should still work
      5. **Empty title** — `add("")` should work without errors

      Run `python tests/test_cp3.py` to verify.
    testCommand: "python tests/test_cp3.py"
    aiEnabled: true
