id: "44444444-4444-4444-4444-444444444441"
title: "迷宮最短路徑（BFS）"
description: |
  You inherit a maze navigation system with a Maze class and a solver module.

  The maze is represented as a 2D grid:
  - 0 = open path
  - 1 = wall

  You can move in 4 directions: up, down, left, right. No diagonal movement.

  Start: top-left corner (0, 0)
  End: bottom-right corner (rows-1, cols-1)

  Your tasks across 3 checkpoints:
  1. Fix a bug in the Maze class causing incorrect end position detection
  2. Implement BFS algorithm to find the shortest path
  3. Handle edge cases and verify the solution on various grid configurations
difficulty: MEDIUM
language: python
type: EXTEND
level: JUNIOR

projectFiles:
  - filePath: maze.py
    editable: true
    sortOrder: 1
  - filePath: solver.py
    editable: true
    sortOrder: 2
  - filePath: utils.py
    editable: false
    sortOrder: 3
  - filePath: tests/test_cp1.py
    editable: false
    sortOrder: 4
  - filePath: tests/test_cp2.py
    editable: false
    sortOrder: 5
  - filePath: tests/test_cp3.py
    editable: false
    sortOrder: 6

checkpoints:
  - id: "44444444-4444-4444-4444-444444444411"
    sequenceNumber: 1
    title: "Phase 1: Bug Fix — 修復 get_end()"
    description: |
      ## Checkpoint 1: Bug Fix（不建議使用 AI）

      `maze.py` 已有初始實作，但有 **1 個 Bug** 導致測試失敗。

      ### 任務

      執行以下指令查看失敗的測試：

      `python tests/test_cp1.py`

      閱讀錯誤訊息和 `maze.py` 的程式碼，找出並修復這個 Bug，讓所有測試通過。

      ### 提示（只在卡住時看）

      - 仔細觀察 `get_end()` 的回傳值，對應迷宮的哪個位置？
      - 網格的最後一行是第幾行？

      ### 評分重點

      此 Checkpoint 考察你**獨立閱讀程式碼**與**假設驅動除錯**的能力。
      請先口頭說明你的假設，再動手修改。

      ⚠️ **建議此階段不使用 AI Chat**
    testCommand: "python tests/test_cp1.py"
    aiEnabled: false

  - id: "44444444-4444-4444-4444-444444444412"
    sequenceNumber: 2
    title: "Phase 2: 實作 BFS 最短路徑"
    description: |
      ## Checkpoint 2: 實作 BFS 最短路徑（可使用 AI）

      在 `solver.py` 中實作 `find_shortest_path(maze)` 函式。

      ### 需求

      - 使用 **BFS（廣度優先搜尋）** 保證找到最短路徑
      - 回傳最短路徑的步數（整數）
      - 如果沒有路徑，回傳 `-1`
      - 如果起點等於終點，回傳 `0`

      ### 執行測試

      `python tests/test_cp2.py`

      ### 提示

      - 使用 `from collections import deque` 建立 BFS 佇列
      - 用 `maze.get_start()` 和 `maze.get_end()` 取得起終點
      - 用 `maze.get_neighbors(row, col)` 取得相鄰節點
      - 記錄已拜訪的節點（visited set）以避免無限迴圈

      ### AI 使用建議

      先向面試官口述你的 BFS 思路，再向 AI 下精確的 micro-prompt，
      例如：「幫我生成一個 BFS 函式框架，接受 start 和 end tuple，使用 deque，回傳步數整數」
    testCommand: "python tests/test_cp2.py"
    aiEnabled: true

  - id: "44444444-4444-4444-4444-444444444413"
    sequenceNumber: 3
    title: "Phase 3: Edge Cases 驗證"
    description: |
      ## Checkpoint 3: Edge Cases 驗證（可使用 AI）

      確保你的 BFS 實作正確處理所有邊界條件：

      ### 需要通過的測試案例

      1. **起點 = 終點**：1×1 網格，回傳 0
      2. **完全封閉**：被牆壁完全隔開，回傳 -1
      3. **多條路徑**：開放 3×3 網格，最短路徑 = 4（無對角線移動）
      4. **大型網格**：10×10 全開放網格，最短路徑 = 18（9+9 步）
      5. **蜿蜒路徑**：5×5 蛇形迷宮，只有一條路線，共 16 步

      ### 執行測試

      `python tests/test_cp3.py`

      ### 評分重點

      - 主動向面試官說明你考慮了哪些 edge cases
      - 審查 AI 產出的程式碼，確保沒有漏掉邊界檢查
      - 說明你的演算法的時間複雜度：O(rows × cols)
    testCommand: "python tests/test_cp3.py"
    aiEnabled: true
