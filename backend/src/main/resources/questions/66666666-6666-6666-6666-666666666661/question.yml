id: "66666666-6666-6666-6666-666666666661"
title: "Python CSV 資料分析器"
description: |
  You inherit a CSV data analysis tool with a CsvReader class and an Analyzer module.

  The tool reads product sales data from a CSV string, computes statistics, and filters records.

  Common AI-generated pitfalls:
  - Using str.split(',') instead of the csv module (breaks on quoted fields)
  - Comparing floats with == instead of using rounding or math.isclose()

  Your tasks across 3 checkpoints:
  1. Fix a CSV parsing bug that breaks on quoted fields
  2. Implement statistical analysis (total, average, max, min)
  3. Handle edge cases: empty CSV, missing values, duplicate headers
difficulty: EASY
language: python
type: EXTEND
level: JUNIOR

projectFiles:
  - filePath: csv_reader.py
    editable: true
    sortOrder: 1
  - filePath: analyzer.py
    editable: true
    sortOrder: 2
  - filePath: tests/test_cp1.py
    editable: false
    sortOrder: 3
  - filePath: tests/test_cp2.py
    editable: false
    sortOrder: 4
  - filePath: tests/test_cp3.py
    editable: false
    sortOrder: 5

checkpoints:
  - id: "66666666-6666-6666-6666-666666666611"
    sequenceNumber: 1
    title: "Phase 1: Bug Fix — 修復 CSV 解析器"
    description: |
      ## Checkpoint 1: Bug Fix（建議先獨立思考）

      `csv_reader.py` 有一個 **Bug**：使用 `line.split(',')` 解析 CSV，
      導致含逗號的引號欄位（如 `"Smith, John"`）被錯誤切割。

      ### 執行測試

      `python tests/test_cp1.py`

      ### 任務

      修復 `parse_csv()` 函式，讓它正確處理帶引號的欄位。

      ### 提示（只在卡住時看）

      Python 標準函式庫的 `csv` 模組（`import csv`）可以正確處理所有 RFC 4180 格式。
      用 `csv.reader(io.StringIO(text))` 取代手動 `split(',')`。

      ⚠️ **AI 的第一個直覺通常是 split(',')，這正是這道題的陷阱**
    testCommand: "python tests/test_cp1.py"
    aiEnabled: true

  - id: "66666666-6666-6666-6666-666666666612"
    sequenceNumber: 2
    title: "Phase 2: 實作統計分析"
    description: |
      ## Checkpoint 2: 統計分析（可使用 AI）

      在 `analyzer.py` 中實作 4 個函式：

      ### `total_sales(records) -> float`
      回傳所有紀錄中 `amount` 欄位的總和。

      ### `average_sales(records) -> float`
      回傳平均 `amount`，結果四捨五入到小數點後 2 位。
      若 records 為空，回傳 0.0。

      ### `max_sale(records) -> dict | None`
      回傳 `amount` 最大的那筆紀錄（整個 dict）。
      若 records 為空，回傳 None。

      ### `min_sale(records) -> dict | None`
      回傳 `amount` 最小的那筆紀錄（整個 dict）。
      若 records 為空，回傳 None。

      ### 執行測試

      `python tests/test_cp2.py`

      ### 重要提示

      ⚠️ **浮點數陷阱**：計算平均值時不要用 `==` 比較，使用 `round()` 或 `math.isclose()`。
    testCommand: "python tests/test_cp2.py"
    aiEnabled: true

  - id: "66666666-6666-6666-6666-666666666613"
    sequenceNumber: 3
    title: "Phase 3: Edge Cases 驗證"
    description: |
      ## Checkpoint 3: Edge Cases（可使用 AI）

      確保你的實作正確處理所有邊界條件：

      1. **空 CSV**（只有 header）— `total_sales` 回傳 0.0，`max_sale` 回傳 None
      2. **單一紀錄**— max 和 min 是同一筆
      3. **負數金額**— `min_sale` 應能找到最小的負數
      4. **浮點精度**— 平均值使用 `round(..., 2)` 驗證
      5. **帶引號欄位**— CSV 解析器正確處理含逗號的字串

      ### 執行測試

      `python tests/test_cp3.py`

      ### 評分重點

      - 主動說明你如何處理空資料集
      - 解釋為何不應用 `==` 比較浮點數
    testCommand: "python tests/test_cp3.py"
    aiEnabled: true
