id: "99999999-9999-9999-9999-999999999991"
title: "Python 任務排程器（拓撲排序）"
description: |
  You inherit a task scheduler that determines the correct execution order for tasks with dependencies.

  Given a list of tasks and their dependencies (task A must run before task B),
  the scheduler must find a valid topological order.

  Common AI-generated pitfalls:
  - Kahn's algorithm implementation not respecting priority when multiple tasks are ready
  - DFS-based approach forgetting to reset the "visiting" color on backtrack (stack overflow risk)

  Your tasks across 3 checkpoints:
  1. Fix a bug in the dependency graph builder
  2. Implement topological sort using Kahn's algorithm with priority
  3. Handle edge cases: cycles, isolated tasks, empty graph
difficulty: HARD
language: python
type: EXTEND
level: SENIOR

projectFiles:
  - filePath: scheduler.py
    editable: true
    sortOrder: 1
  - filePath: graph.py
    editable: true
    sortOrder: 2
  - filePath: tests/test_cp1.py
    editable: false
    sortOrder: 3
  - filePath: tests/test_cp2.py
    editable: false
    sortOrder: 4
  - filePath: tests/test_cp3.py
    editable: false
    sortOrder: 5

checkpoints:
  - id: "99999999-9999-9999-9999-999999999911"
    sequenceNumber: 1
    title: "Phase 1: Bug Fix — 修復依賴圖建構"
    description: |
      ## Checkpoint 1: Bug Fix

      `graph.py` 的 `build_graph()` 函式有一個 **Bug**：
      依賴方向建反了。正確的意思是「A 依賴 B」= B 必須先於 A 執行。

      ### 執行測試

      `python tests/test_cp1.py`

      ### 任務

      閱讀 `build_graph()` 和測試的期望值，找出並修復這個 Bug。

      ### 提示（只在卡住時看）

      若 task A depends_on B，則 `in_degree[A]` 應增加（B → A 的邊），
      而不是 `in_degree[B]`。

      ⚠️ **先說出你的假設，再動手修改**
    testCommand: "python tests/test_cp1.py"
    aiEnabled: true

  - id: "99999999-9999-9999-9999-999999999912"
    sequenceNumber: 2
    title: "Phase 2: 實作 Kahn's 算法拓撲排序"
    description: |
      ## Checkpoint 2: 實作拓撲排序（可使用 AI）

      在 `scheduler.py` 中實作 `topological_sort(tasks, dependencies)` 函式。

      ### 需求

      使用 **Kahn's 算法**（BFS-based）：
      1. 建立依賴圖（使用 `graph.build_graph()`）
      2. 找出所有 in-degree = 0 的任務，放入優先佇列（依 priority 排序）
      3. 每次取出優先度最高的任務（priority 數值最小者優先）
      4. 將其鄰居的 in-degree 減 1，若減為 0 則加入佇列
      5. 若所有任務都被處理完 → 回傳排序結果
      6. 若有剩餘任務 → 偵測到循環依賴，raise `ValueError("Cycle detected")`

      ### Task 資料格式

      ```python
      {"id": "task_a", "priority": 1}  # priority 越小越優先
      ```

      ### 執行測試

      `python tests/test_cp2.py`

      ### AI 協作建議

      口述你的 Kahn's 算法步驟，再請 AI 幫你實作優先佇列部分：
      「用 heapq 實作一個以 (priority, task_id) 為鍵的最小堆佇列」
    testCommand: "python tests/test_cp2.py"
    aiEnabled: true

  - id: "99999999-9999-9999-9999-999999999913"
    sequenceNumber: 3
    title: "Phase 3: Edge Cases 驗證"
    description: |
      ## Checkpoint 3: Edge Cases（可使用 AI）

      確保你的排程器正確處理所有邊界條件：

      1. **循環依賴**：A → B → C → A，應 raise `ValueError("Cycle detected")`
      2. **孤立任務**：沒有任何依賴關係的任務，應出現在結果中
      3. **空任務列表**：回傳空 list
      4. **相同優先度**：多個任務相同優先度時，輸出順序一致
      5. **單一任務**：只有一個任務，直接回傳

      ### 執行測試

      `python tests/test_cp3.py`

      ### 評分重點

      - 主動說明你的循環偵測策略
      - 解釋 Kahn's vs DFS 拓撲排序的時間複雜度差異
      - 說明你的 priority 實作是否保證穩定排序
    testCommand: "python tests/test_cp3.py"
    aiEnabled: true
