id: "ffffffff-ffff-ffff-ffff-fffffffffff1"
title: "Spring Boot 訂單狀態機"
description: |
  You take over an e-commerce order processing system. Orders have a defined state flow:
  CREATED -> CONFIRMED -> SHIPPED -> DELIVERED, and can be cancelled from any non-DELIVERED state.

  The system uses an Event pattern to notify downstream services.
  Currently the state transition logic has bugs, and event publishing is not yet implemented.

  Your tasks across 4 checkpoints:
  1. Fix state transition bugs (CANCELLED path + idempotent check)
  2. Implement confirmOrder() with inventory reservation + event publishing
  3. Implement cancelOrder() with compensation logic (best-effort release)
  4. Add optimistic locking for concurrent order processing
difficulty: HARD
language: java
type: EXTEND
level: SENIOR

