id: "question1"
title: "Java Hangman 猜字遊戲"
language: "java"
difficulty: "MEDIUM"
image: "spike19820318/ai-coding-interview-question01:latest"
description: |
  你接手了一個 Java Hangman 猜字遊戲專案。前一位工程師留下了有 Bug 的程式碼和未實作的功能。
  依照 4 張工單依序完成：修復 Bug → 實作提示系統 → 加入難度系統 → 補強輸入驗證。

checkpoints:
  - id: "1"
    title: "Bug Fix — 修復遊戲邏輯"
    description: |
      QA 回報了兩個 Bug：
      1. 重複猜同一個錯誤字母會多次扣命（預期：重複猜測應被忽略）
      2. isGameWon() 回傳了錯誤的條件（命數歸零被判為勝利，猜出所有字母卻沒有）
      請閱讀 Game.java 找出並修復這兩個問題。
    testCommand: "./gradlew test --tests 'exam.question.bdd.CP1Test' --no-daemon"

  - id: "2"
    title: "Feature — 實作 HintProvider 提示系統"
    description: |
      實作 HintProvider.java 中的 3 個 TODO 方法：
      • getLetterFrequencyHint：回傳出現頻率最高的未猜字母（平手取字母序較前者，全猜完回傳 null）
      • getPositionHint：回傳第一個未猜字母的位置（1-based，全猜完回傳 -1）
      • calculateScore：max(0, wordLength×100 - wrongGuesses×10 - hintsUsed×20)
    testCommand: "./gradlew test --tests 'exam.question.bdd.CP2Test' --no-daemon"

  - id: "3"
    title: "Feature — 加入難度系統"
    description: |
      Difficulty 列舉和 WordBank 已準備好。請實作 Game(String word, Difficulty difficulty) 建構子，
      根據 difficulty.getMaxLives() 設定命數（EASY=8, MEDIUM=6, HARD=4）。
      目前此建構子會拋出 UnsupportedOperationException，請替換為正確實作。
    testCommand: "./gradlew test --tests 'exam.question.bdd.CP3Test' --no-daemon"

  - id: "4"
    title: "Hardening — 輸入驗證與邊界情況"
    description: |
      加入防禦性程式設計：
      • Game(null/""/空白) → IllegalArgumentException
      • 遊戲結束後呼叫 processGuess() → IllegalStateException
      • 猜測非字母字元 → IllegalArgumentException
      • HintProvider 處理 null/空字串輸入不拋錯（回傳 null 或 -1）
    testCommand: "./gradlew test --tests 'exam.question.bdd.CP4Test' --no-daemon"
