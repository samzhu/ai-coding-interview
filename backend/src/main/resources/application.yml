spring:
  application:
    name: ai-coding-interview
  threads:
    virtual:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
aci:
  models:
    - id: gemini-2.5-flash
      name: Gemini 2.5 Flash
      provider: google-genai
      api-key: ${GOOGLE_GENAI_API_KEY:}
      temperature: 0.7
    - id: gemini-2.0-flash
      name: Gemini 2.0 Flash
      provider: google-genai
      api-key: ${GOOGLE_GENAI_API_KEY:}
      temperature: 0.7

server:
  port: 8080
  shutdown: graceful

admin:
  token: ${ADMIN_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

execution:
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    tls-verify: ${DOCKER_TLS_VERIFY:false}
    cert-path: ${DOCKER_CERT_PATH:}
    image: ${EXECUTION_DOCKER_IMAGE:eclipse-temurin:25-jdk}

interview:
  cleanup:
    # 面試計時結束後的額外寬限期（分鐘）。
    # 設為 60 分鐘，給排程週期與前後端時鐘誤差足夠的緩衝，避免誤判仍在倒數的面試。
    grace-period-minutes: 60
    # 排程 cron 表達式：每小時 50 分，上班時間 08:50~18:50，週一至週五。
    # 選擇 50 分而非整點，避免與其他系統排程集中衝突。
    cron: "0 50 8-18 * * MON-FRI"
