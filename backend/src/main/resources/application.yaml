spring:
  application:
    name: ai-coding-interview
  profiles:
    # 預設同時啟用本地基礎設施（local）與開發環境行為（dev）。
    # 生產部署時覆寫為 "gcp,prod"。
    default: local,dev
  threads:
    virtual:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  mvc:
    problemdetails:
      enabled: true
    async:
      # SSE 串流（AI 聊天）可能持續數分鐘（AI tool 執行 gradle test 等長時間指令），
      # -1 表示不設超時，讓串流自然結束或由前端關閉連線。
      request-timeout: -1
  security:
    oauth2:
      resourceserver:
        jwt:
          # aci.security.enabled=true 時需設定（透過 secrets 或環境變數）。
          issuer-uri: ${aci-oauth2-issuer-uri:}


aci:
  system-prompt-resource: classpath:prompts/system-prompt-dev.md
  models:
    - id: gemini-3.1-flash-lite-preview
      name: Gemini 3.1 Flash-Lite Preview
      provider: google-genai
      api-key: ${aci-google-genai-api-key:}
    - id: claude-sonnet-4-6
      name: Claude Sonnet 4.6
      provider: anthropic
      api-key: ${aci-anthropic-api-key:}
    - id: gpt-5-nano
      name: GPT-5 Nano
      provider: openai
      api-key: ${aci-openai-api-key:}
  security:
    # 設為 true 啟用完整 OAuth2 安全機制（需設定 aci-oauth2-issuer-uri）。
    # 預設 false：所有 API 公開，方便本地開發。
    enabled: ${aci-security-enabled:true}
    # CORS 允許的前端 Origin（逗號分隔），prod 應設為實際域名。
    cors-allowed-origins: ${aci-cors-allowed-origins:http://localhost:3000,http://localhost:3001}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

execution:
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}

interview:
  cleanup:
    # 面試計時結束後的額外寬限期（分鐘）。
    # 設為 60 分鐘，給排程週期與前後端時鐘誤差足夠的緩衝，避免誤判仍在倒數的面試。
    grace-period-minutes: 60
    # 排程 cron 表達式：每小時 50 分，上班時間 08:50~18:50，週一至週五。
    # 選擇 50 分而非整點，避免與其他系統排程集中衝突。
    cron: "0 50 8-18 * * MON-FRI"
